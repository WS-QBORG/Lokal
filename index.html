<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>HVAC Geo Quest - Mapa Projektantów</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Leaflet.draw CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    
    <!-- MarkerCluster CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.4.1/MarkerCluster.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.4.1/MarkerCluster.Default.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            background-color: #1f2937;
        }

        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* Panel kontroli */
        #controlPanel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(31, 41, 55, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            color: white;
            z-index: 1000;
            min-width: 300px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Ukryj mobile text na desktop */
        .mobile-text, .mobile-title {
            display: none;
        }

        #controlPanel h2 {
            margin-bottom: 15px;
            color: #60a5fa;
            font-size: 1.2rem;
        }

        .control-section {
            margin-bottom: 15px;
        }

        .control-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #d1d5db;
            font-size: 0.9rem;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .btn-add-client {
            background: #10b981;
            color: white;
        }

        .btn-add-client:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .dropdown-wrapper {
            position: relative;
        }

        .dropdown-button {
            background: #374151;
            color: white;
            border: 1px solid #4b5563;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .dropdown-button:hover {
            background: #4b5563;
            border-color: #6b7280;
        }

        .dropdown-content {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #374151;
            border: 1px solid #4b5563;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1001;
            display: none;
        }

        .filter-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #4b5563;
        }

        .filter-option:last-child {
            border-bottom: none;
        }

        .filter-option:hover {
            background: #4b5563;
        }

        .filter-option label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            margin: 0;
            flex: 1;
        }

        .filter-count {
            color: #9ca3af;
            font-size: 0.8rem;
        }

        /* Sidebar */
        #sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background: rgba(31, 41, 55, 0.98);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            transition: right 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
            color: white;
        }

        #sidebar.show {
            right: 0;
        }

        #sidebarHeader {
            background: rgba(59, 130, 246, 0.1);
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #sidebarHeader h3 {
            margin-bottom: 15px;
            color: #60a5fa;
        }

        #searchInput {
            width: 100%;
            padding: 10px;
            background: #374151;
            border: 1px solid #4b5563;
            border-radius: 6px;
            color: white;
            margin-bottom: 10px;
        }

        #sidebarContent {
            padding: 20px;
        }

        .projektant-entry {
            background: rgba(75, 85, 99, 0.5);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .projektant-entry .name {
            cursor: pointer;
            color: #60a5fa;
            font-weight: 500;
        }

        .projektant-entry .name:hover {
            color: #93c5fd;
        }

        .projektant-entry select {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: #374151;
            border: 1px solid #4b5563;
            border-radius: 4px;
            color: white;
        }

        /* Client Sidebar */
        #clientSidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background: rgba(31, 41, 55, 0.98);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            transition: right 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
            color: white;
        }

        #clientSidebar.show {
            right: 0;
        }

        .client-entry {
            background: rgba(16, 185, 129, 0.1);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .client-name {
            cursor: pointer;
            color: #10b981;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .client-name:hover {
            color: #34d399;
        }

        .client-details {
            font-size: 0.85rem;
            color: #d1d5db;
            line-height: 1.4;
        }

        /* Profile Panel */
        #profilePanel, #clientProfilePanel {
            position: fixed;
            top: 0;
            right: -500px;
            width: 500px;
            height: 100vh;
            background: rgba(31, 41, 55, 0.98);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            transition: right 0.3s ease;
            z-index: 1001;
            overflow-y: auto;
            color: white;
            padding: 30px;
        }

        #profilePanel.show, #clientProfilePanel.show {
            right: 0;
        }

        #profileContent textarea, #clientProfileContent textarea {
            width: 100%;
            height: 120px;
            margin-top: 10px;
            padding: 10px;
            background: #374151;
            border: 1px solid #4b5563;
            border-radius: 6px;
            color: white;
            resize: vertical;
            font-family: inherit;
        }

        /* Loading Overlay */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
            font-size: 1.2rem;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-right: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Add Point Panel */
        #addPointPanel, #addClientPanel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(31, 41, 55, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            color: white;
            z-index: 2000;
            display: none;
            min-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        #addPointPanel h3, #addClientPanel h3 {
            margin-bottom: 20px;
            color: #60a5fa;
            text-align: center;
        }

        #addPointPanel label, #addClientPanel label {
            display: block;
            margin-bottom: 5px;
            color: #d1d5db;
            font-weight: 500;
        }

        #addPointPanel input, #addPointPanel select, #addClientPanel input, #addClientPanel select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #374151;
            border: 1px solid #4b5563;
            border-radius: 6px;
            color: white;
        }

        #addPointPanel button, #addClientPanel button {
            margin-right: 10px;
            margin-top: 10px;
        }

        /* Rotate Control */
        #rotateControl {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(31, 41, 55, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            padding: 15px 25px;
            color: white;
            z-index: 1000;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #rotateSlider {
            width: 200px;
            margin: 0 10px;
        }

        /* Popup styles */
        .popup-wrapper {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.4;
            min-width: 250px;
        }

        .popup-title {
            color: #1f2937;
            font-size: 1.1rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .popup-select {
            margin: 10px 0;
        }

        .popup-select select {
            width: 100%;
            padding: 6px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            background: white;
        }

        .popup-actions {
            margin: 15px 0 10px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .popup-link {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            font-weight: 500;
        }

        /* Leaflet Draw Controls - lepsze pozycjonowanie */
        .leaflet-draw {
            z-index: 1000 !important;
        }

        .leaflet-control-container .leaflet-top.leaflet-left {
            top: 20px !important;
            left: 450px !important;
        }

        /* Panel overlay styles */
        body.panel-open {
            overflow: hidden;
        }

        /* Mobile Toggle Button */
        #mobileToggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(59, 130, 246, 0.9);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 1002;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        #mobileToggle:hover {
            transform: scale(1.05);
            background: rgba(59, 130, 246, 1);
        }

        #mobileToggle.active {
            background: rgba(239, 68, 68, 0.9);
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            /* Pokaż mobile toggle */
            #mobileToggle {
                display: flex;
            }

            /* Ukryj panel kontroli domyślnie na mobile */
            #controlPanel {
                position: fixed !important;
                left: -100% !important;
                right: auto;
                top: 0;
                width: 90%;
                max-width: 320px;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0 12px 12px 0;
                padding: 20px 15px;
                transition: left 0.3s ease;
                overflow-y: auto;
                z-index: 1000;
                transform: translateX(0);
            }

            #controlPanel.mobile-show {
                left: 0 !important;
                transform: translateX(0);
            }

            /* Pokaż mobile text, ukryj desktop text na mobile */
            .desktop-text, .desktop-title {
                display: none;
            }
            
            .mobile-text, .mobile-title {
                display: inline;
            }
            
            /* Kompaktowe dropdowny */
            .dropdown-button {
                padding: 12px !important;
                font-size: 0.9rem !important;
                min-height: auto !important;
            }

            .control-section {
                margin-bottom: 10px;
            }

            /* Kompaktowy nagłówek */
            #controlPanel h2 {
                font-size: 1rem;
                margin-bottom: 10px;
            }

            /* Kompaktowe przyciski na mobile */
            .control-buttons {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                margin-top: 15px;
            }

            .btn {
                padding: 10px 8px !important;
                font-size: 0.85rem !important;
                min-height: 40px !important;
                border-radius: 6px;
                text-align: center;
            }

            #clearFiltersBtn {
                grid-column: 1 / -1;
            }

            /* Override dropdown styles for mobile */
            .dropdown-content {
                max-height: 200px;
            }

            .filter-option {
                padding: 12px;
                font-size: 0.9rem;
            }

            /* Sidebary na mobile */
            #sidebar, #clientSidebar {
                width: 100%;
                right: -100%;
            }

            #sidebarHeader {
                padding-top: 80px;
            }

            /* Profile panels na mobile */
            #profilePanel, #clientProfilePanel {
                width: 100%;
                right: -100%;
                padding: 80px 20px 20px 20px;
            }

            /* Modal panels na mobile */
            #addPointPanel, #addClientPanel {
                left: 10px;
                right: 10px;
                top: 20px;
                transform: none;
                min-width: auto;
                padding: 20px;
                max-height: calc(100vh - 40px);
                overflow-y: auto;
            }

            #addPointPanel input, #addPointPanel select, 
            #addClientPanel input, #addClientPanel select {
                padding: 15px;
                font-size: 1rem;
                min-height: 48px;
            }

            /* Rotate control na mobile */
            #rotateControl {
                left: 10px;
                right: 10px;
                bottom: 80px;
                transform: none;
                padding: 20px;
            }

            #rotateSlider {
                width: 100%;
                margin: 10px 0;
                height: 40px;
            }

            /* Leaflet controls na mobile */
            .leaflet-control-container .leaflet-top.leaflet-left {
                top: 80px !important;
                left: 10px !important;
            }

            .leaflet-control-container .leaflet-top.leaflet-right {
                top: 80px !important;
                right: 10px !important;
            }

            .leaflet-control-zoom {
                border-radius: 8px !important;
            }

            .leaflet-control-zoom a {
                width: 44px !important;
                height: 44px !important;
                line-height: 42px !important;
                font-size: 20px !important;
            }

            /* Lepsze popupy na mobile */
            .leaflet-popup-content-wrapper {
                border-radius: 8px;
            }

            .popup-wrapper {
                min-width: 280px;
                font-size: 1rem;
            }

            .popup-title {
                font-size: 1.2rem;
            }

            .popup-actions {
                gap: 12px;
            }

            .popup-actions button {
                padding: 12px 16px;
                font-size: 1rem;
                min-height: 44px;
                border-radius: 6px;
            }

            /* Search inputy na mobile */
            #searchInput, #clientSearchInput {
                padding: 15px;
                font-size: 1rem;
                min-height: 48px;
            }

            /* Select elementy na mobile */
            #sortFilterSelect, #clientSortFilterSelect {
                padding: 15px !important;
                font-size: 1rem !important;
                min-height: 48px !important;
            }

            /* Projektant entries na mobile */
            .projektant-entry {
                padding: 20px 15px;
                margin-bottom: 15px;
            }

            .projektant-entry .name {
                font-size: 1.1rem;
                line-height: 1.4;
            }

            .projektant-entry select {
                padding: 15px !important;
                font-size: 1rem !important;
                min-height: 48px !important;
                margin-top: 15px !important;
            }

            /* Client entries na mobile */
            .client-entry {
                padding: 20px 15px;
                margin-bottom: 15px;
            }

            .client-name {
                font-size: 1.1rem;
                margin-bottom: 12px;
            }

            .client-details {
                font-size: 1rem;
                line-height: 1.5;
            }

            /* Loading overlay na mobile */
            #loadingOverlay {
                font-size: 1.1rem;
            }

            .spinner {
                width: 60px;
                height: 60px;
                margin-right: 15px;
            }
        }

        /* Tablet responsive */
        @media (max-width: 1024px) and (min-width: 769px) {
            #controlPanel {
                min-width: 280px;
                padding: 18px;
            }

            .control-buttons {
                flex-wrap: wrap;
            }

            .btn {
                padding: 12px 16px;
                font-size: 0.95rem;
            }

            #sidebar, #clientSidebar {
                width: 350px;
            }

            #profilePanel, #clientProfilePanel {
                width: 450px;
            }
        }

        /* Landscape mobile */
        @media (max-width: 768px) and (orientation: landscape) {
            #controlPanel {
                max-width: 300px;
                padding: 60px 15px 15px 15px;
            }

            #sidebarHeader {
                padding-top: 60px;
            }

            #profilePanel, #clientProfilePanel {
                padding: 60px 15px 15px 15px;
            }

            .leaflet-control-container .leaflet-top.leaflet-left,
            .leaflet-control-container .leaflet-top.leaflet-right {
                top: 60px !important;
            }

            #mobileToggle {
                top: 10px;
                right: 10px;
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>
<body>
    <!-- Mobile Toggle Button -->
    <button id="mobileToggle" onclick="toggleMobilePanel()">☰</button>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Panel kontroli -->
    <div id="controlPanel">
        <h2 class="desktop-title">🎛️ Filtry i Kontrola</h2>
        <h2 class="mobile-title">Filtry i Kontrola</h2>
        
        <!-- Dropdown Status -->
        <div class="control-section">
            <div class="dropdown-wrapper" id="statusDropdownWrapper">
                <div class="dropdown-button" onclick="toggleStatusDropdown()">
                    <span class="desktop-text">🔴 Status</span>
                    <span class="mobile-text">Status</span>
                    <span id="statusIcon">⯆</span>
                </div>
                <div class="dropdown-content" id="statusDropdown"></div>
            </div>
        </div>

        <!-- Dropdown Handlowcy -->
        <div class="control-section">
            <div class="dropdown-wrapper" id="handlowcyDropdownWrapper">
                <div class="dropdown-button" onclick="toggleHandlowcyDropdown()">
                    <span class="desktop-text">👨‍💼 Handlowcy</span>
                    <span class="mobile-text">Handlowcy</span>
                    <span id="handlowcyIcon">⯆</span>
                </div>
                <div class="dropdown-content" id="handlowcyDropdown"></div>
            </div>
        </div>

        <!-- Dropdown Rok -->
        <div class="control-section">
            <div class="dropdown-wrapper" id="rokDropdownWrapper">
                <div class="dropdown-button" onclick="toggleRokDropdown()">
                    <span class="desktop-text">📅 Rok</span>
                    <span class="mobile-text">Rok</span>
                    <span id="rokIcon">⯆</span>
                </div>
                <div class="dropdown-content" id="rokDropdown"></div>
            </div>
        </div>

        <!-- Dropdown Typ inwestycji -->
        <div class="control-section">
            <div class="dropdown-wrapper" id="inwestycjeDropdownWrapper">
                <div class="dropdown-button" onclick="toggleInwestycjeDropdown()">
                    <span class="desktop-text">🏠 Typ inwestycji</span>
                    <span class="mobile-text">Typ inwestycji</span>
                    <span id="inwestycjeIcon">⯆</span>
                </div>
                <div class="dropdown-content" id="inwestycjeDropdown"></div>
            </div>
        </div>

        <!-- Przyciski -->
        <div class="control-buttons">
            <button class="btn btn-primary" onclick="showProjektanci()">
                <span class="desktop-text">🧑‍💼 Projektanci</span>
                <span class="mobile-text">Projektanci</span>
            </button>
            <button class="btn btn-success" onclick="showKlienci()">
                <span class="desktop-text">👥 Klienci</span>
                <span class="mobile-text">Klienci</span>
            </button>
            <button class="btn" style="background:#6b7280;color:white;" onclick="startAddPointMode()">
                <span class="desktop-text">✨ Dodaj punkt</span>
                <span class="mobile-text">Dodaj punkt</span>
            </button>
            <button class="btn" id="clearFiltersBtn" onclick="clearAllFilters()" style="background:#ef4444;color:white;display:none;">
                <span class="desktop-text">🗑️ Wyczyść filtry</span>
                <span class="mobile-text">Wyczyść filtry</span>
            </button>
        </div>
    </div>

    <!-- Sidebar Projektanci -->
    <div id="sidebar">
        <div id="sidebarHeader">
            <h3>Projektanci</h3>
            <input type="text" id="searchInput" placeholder="Szukaj projektanta..." onkeyup="filterProjektanciList()">
            <select id="sortFilterSelect" onchange="applySortFilter()" style="width:100%;padding:8px;background:#374151;border:1px solid #4b5563;border-radius:4px;color:white;margin-bottom:10px;">
                <option value="">Sortuj</option>
                <option value="az">A-Z</option>
                <option value="za">Z-A</option>
                <option value="has-handlowiec">Z handlowcem</option>
                <option value="no-handlowiec">Bez handlowca</option>
                <option value="proj-asc">Mało projektów</option>
                <option value="proj-desc">Dużo projektów</option>
            </select>
            <button class="btn btn-primary" onclick="applyProjektantFilter()">Zastosuj filtr</button>
            <button class="btn" style="background:#6b7280;color:white;" onclick="hideSidebar()">Anuluj</button>
        </div>
        <div id="sidebarContent"></div>
    </div>

    <!-- Client Sidebar -->
    <div id="clientSidebar">
        <div id="sidebarHeader">
            <h3>Klienci</h3>
            <input type="text" id="clientSearchInput" placeholder="Szukaj klienta..." onkeyup="filterKlienciList()">
            <select id="clientSortFilterSelect" onchange="applyClientSortFilter()" style="width:100%;padding:8px;background:#374151;border:1px solid #4b5563;border-radius:4px;color:white;margin-bottom:10px;">
                <option value="">Sortuj</option>
                <option value="az">A-Z</option>
                <option value="za">Z-A</option>
                <option value="newest">Najnowsi</option>
                <option value="oldest">Najstarsi</option>
                <option value="by-handlowiec">Według handlowca</option>
                <option value="by-projektant">Według projektanta</option>
            </select>
            <button class="btn" style="background:#6b7280;color:white;" onclick="hideClientSidebar()">Zamknij</button>
        </div>
        <div id="clientSidebarContent"></div>
    </div>

    <!-- Profile Panel -->
    <div id="profilePanel">
        <div id="profileContent"></div>
    </div>

    <!-- Client Profile Panel -->
    <div id="clientProfilePanel">
        <div id="clientProfileContent"></div>
    </div>

    <!-- Add Point Panel -->
    <div id="addPointPanel">
        <h3>Dodaj nowy punkt</h3>
        <form id="addPointForm">
            <label>Handlowiec:</label>
            <select id="inputHandlowiec" required></select>
            
            <label>Projektant:</label>
            <input type="text" id="inputProjektant" placeholder="Nazwa projektanta" required>
            
            <label>Adres:</label>
            <input type="text" id="inputAdres" placeholder="Adres projektu" required>
            
            <label>Klient:</label>
            <input type="text" id="inputKlient" placeholder="Nazwa klienta" required>
            
            <button type="button" class="btn btn-success" onclick="confirmAddPoint()">✅ Potwierdź</button>
            <button type="button" class="btn" style="background:#6b7280;color:white;" onclick="cancelAddPoint()">❌ Anuluj</button>
        </form>
    </div>

    <!-- Add Client Panel -->
    <div id="addClientPanel">
        <h3>Dodaj nowego klienta</h3>
        <form id="addClientForm">
            <label>Imię i nazwisko:</label>
            <input type="text" id="inputClientImie" placeholder="Jan Kowalski" required>
            
            <label>Telefon:</label>
            <input type="tel" id="inputClientTelefon" placeholder="+48 123 456 789" required>
            
            <label>Handlowiec:</label>
            <select id="inputClientHandlowiec" required></select>
            
            <label>Projektant:</label>
            <select id="inputClientProjektant" required></select>
            
            <label>Projekt:</label>
            <select id="inputClientProjekt" required></select>
            
            <button type="button" class="btn btn-success" onclick="confirmAddClient()">✅ Dodaj klienta</button>
            <button type="button" class="btn" style="background:#6b7280;color:white;" onclick="cancelAddClient()">❌ Anuluj</button>
        </form>
    </div>

    <!-- Rotate Control -->
    <div id="rotateControl">
        <label for="rotateSlider">Obrót: <span id="rotateValue">0°</span></label>
        <input type="range" id="rotateSlider" min="0" max="360" value="0" step="1">
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <span>Ładowanie danych...</span>
    </div>

        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue, set, push } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {

        window.firebaseDB = database;

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet.draw -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    
    <!-- MarkerCluster -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.4.1/leaflet.markercluster.js"></script>

    <!-- App JS -->
    <script src="app.js"></script>
</body>
</html>
